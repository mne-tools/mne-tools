name: 'MNE-Tools: Setup MNE-C minimal commands'
description: 'Download, cache and set up the MNE-C "minimal commands" (mne_process_raw, mne_surf2bem, mri_watershed, mkheadsurf, ...). Platforms with no bundle published are a no-op, so callers do not need an `if:` conditional.'
author: 'MNE-Tools'
outputs:
  installed:
    description: '"true" if the minimal commands were set up, "false" on platforms that have no bundle.'
    value: ${{ steps.setup.outputs.installed }}
runs:
  using: composite
  steps:
    - name: Get root directory of the action
      id: action-root
      uses: $/actions/get-action-root
    - name: Compute cache key
      id: key
      # Hashing the install script means bumping the release tag in it invalidates
      # existing caches. Which platforms actually have a bundle is decided solely by
      # the script, so that list is not duplicated here.
      run: |
        set -eo pipefail
        SCRIPT="${{ steps.action-root.outputs.action-root }}/tools/get_minimal_commands.sh"
        if command -v sha256sum > /dev/null; then
          SHA=$(sha256sum "$SCRIPT")
        else
          SHA=$(shasum -a 256 "$SCRIPT")
        fi
        echo "key=minimal-cmds-$(uname -s)-$(uname -m)-${SHA:0:8}" | tee -a "$GITHUB_OUTPUT"
      shell: bash
    - name: Cache minimal commands
      uses: actions/cache@v6.1.0
      with:
        key: ${{ steps.key.outputs.key }}
        path: ~/minimal_cmds
    - name: Setup minimal commands
      id: setup
      # Sourced rather than run so that MNE_ROOT is visible here: the script only
      # sets it on platforms that have a bundle, which is what `installed` reports.
      run: |
        set -eo pipefail
        source "${{ steps.action-root.outputs.action-root }}/tools/get_minimal_commands.sh"
        if [ -n "${MNE_ROOT}" ]; then
          echo "installed=true" | tee -a "$GITHUB_OUTPUT"
        else
          echo "::notice title=Minimal commands::No MNE-C minimal commands exist for $(uname -s)/$(uname -m), skipping."
          echo "installed=false" | tee -a "$GITHUB_OUTPUT"
        fi
      shell: bash
