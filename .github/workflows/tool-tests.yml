name: 'Tool tests'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pytest:
    name: 'pytest (${{ matrix.python-version }})'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest and newest supported, see `requires-python` in `pyproject.toml`
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group test
        name: 'Install'
      - run: pytest tests --cov=mne_tools --cov-report=term-missing --cov-report=xml
        name: 'Run tests'
      - uses: codecov/codecov-action@v7.0.0
        name: 'Upload coverage'
        if: success() || failure()
  check-qt-import:
    name: '${{ matrix.os }}'
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      CI_OS_NAME: '${{ matrix.os }}'
      DISPLAY: ':99'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: ./tools/setup_xvfb.sh
        name: 'Setup Xvfb'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6
        name: 'Install PySide6'
      - run: bash ./tools/check_qt_import.sh PySide6
        name: 'Check PySide6 importable'
  check-action-root:
    name: '${{ matrix.os }}'
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      CI_OS_NAME: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get root directory of the action
        id: action-root
        uses: $/actions/get-action-root
      - name: Check source directory exists
        run: |
          if [ ! -d "${{ steps.action-root.outputs.action-root }}/src/mne_tools" ]; then
            echo "Source directory does not exist"
            exit 1
          else
            echo "Source directory exists"
          fi
