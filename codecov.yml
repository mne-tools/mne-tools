comment: false
github_checks:  # too noisy, even though "a" interactively disables them
  annotations: false

codecov:
  token: 00c5fe28-08f5-4a36-a7b6-3a23dacc31d3
  notify:
    require_ci_to_pass: false

coverage:
  status:
    patch:
      default:
        informational: true
        target: 95%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: failure
    project:
      default:
        informational: true
        target: auto  # coverage is still low, so track the trend rather than a floor
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: failure
